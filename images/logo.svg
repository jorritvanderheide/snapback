<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- A snowflake in NixOS's two blues, arm by arm, as the snapshot each
       backup freezes. One arm melts into a drop, and the arrow freezes it
       again: snap back. -->
  <defs>
    <path id="arm" d="M100 84V42M100 64L84 50M100 64L116 50" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <g transform="translate(-11 -7)">
    <use href="#arm" stroke="#5277c3"/>
    <use href="#arm" stroke="#7ebae4" transform="rotate(60 100 100)"/>
    <use href="#arm" stroke="#5277c3" transform="rotate(120 100 100)"/>
    <use href="#arm" stroke="#5277c3" transform="rotate(240 100 100)"/>
    <use href="#arm" stroke="#7ebae4" transform="rotate(300 100 100)"/>
    <path d="M100 116V124" stroke="#7ebae4" stroke-width="13" stroke-linecap="round"/>
    <path d="M100 126V142" stroke="#7ebae4" stroke-width="5" stroke-linecap="round"/>
    <path d="M100 138C100 138 87 152 87 161A13 13 0 0 0 113 161C113 152 100 138 100 138z" fill="#7ebae4"/>
    <path d="M127.36 175.18A80 80 0 0 0 175.18 72.64" fill="none" stroke="#5277c3" stroke-width="12" stroke-linecap="round"/>
    <path d="M166.98 50.08L195 68.62L157.4 82.3z" fill="#5277c3"/>
  </g>
</svg>
