name: Feature request
about: An idea for something snapback could do, or do better.
labels: ['enhancement']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for sharing your idea. snapback is deliberately small: a snapshot for each backup, entries next to their services, and one restore command. So it helps most to hear what you're trying to get done, more than how you'd build it.

    - type: textarea
      id: goal
      attributes:
          label: What are you trying to do?
          description: The services, the host or the situation where this came up.
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: What gets in the way today?
      validations:
          required: true

    - type: textarea
      id: idea
      attributes:
          label: What would help?
          description: Optional. If you have a picture of how it could work, describe it here.
