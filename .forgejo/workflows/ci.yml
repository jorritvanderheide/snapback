# The VM test on every push to main and every pull request, on the Forgejo
# runner on dapple (label nix): Nix through dapple's daemon, with KVM for
# the NixOS VM test, which Codeberg's own runners lack. The runner has no
# git, so the source comes as Codeberg's archive of the commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: nix
    timeout-minutes: 60
    steps:
      - name: Source
        run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz" | tar -xz --strip-components=1

      # The VM test, and the restore command's shellcheck.
      - run: nix flake check -L
